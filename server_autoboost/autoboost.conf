# /etc/autoboost/autoboost.conf
# Configuration for Linux AutoBoost Service

[autoboost]
# Thresholds
ram_threshold_percent = 85
cpu_threshold_percent = 90
check_interval_seconds = 5
cooldown_seconds = 30

# Actions to perform on memory trigger
drop_caches = true
compact_memory = true
flush_dns = true
vacuum_journal = true
max_journal_size = 100M

# CPU Hog Taming
renice_cpu_hogs = true
cpu_hog_threshold = 30.0

# Protected process names (case-insensitive substring match, comma-separated)
# Processes in this list will NEVER be reniced or deprioritized.
protected_processes = systemd,kthreadd,sshd,mariadbd,mysqld,nginx,httpd,dockerd,containerd,docker-proxy,amazon-ssm-agent,systemd-journald,systemd-resolved,systemd-udevd,dbus-broker,n8n,node,python,python3,pm2,spamd,fail2ban,hestia,autoboost
